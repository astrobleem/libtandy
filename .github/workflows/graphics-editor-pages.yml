name: Deploy Graphics Workshop

on:
  push:
    branches:
      - codex/libtandy-graphics-editor
    paths:
      - 'tools/graphics-editor/**'
      - '.github/workflows/graphics-editor-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: graphics-workshop-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out editor files
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/graphics-editor

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the static editor
        uses: actions/upload-pages-artifact@v3
        with:
          path: tools/graphics-editor

      - name: Publish editor
        id: deployment
        uses: actions/deploy-pages@v4
